<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English ↔ Hebrew Cards</title>
<style>
  :root { --bg:#fff7e6; --ink:#2b2b3a; --front:#ffd166; --back:#8ecae6; --accent:#ef476f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; gap:16px; }
  h1 { margin:0; font-size:1.4rem; }
  #count { opacity:.7; }
  .scene { perspective:1000px; width:min(90vw,420px); height:min(60vw,280px); min-height:220px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .card { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; -webkit-transform-style:preserve-3d; }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:24px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:12px; text-align:center; }
  .front { background:var(--front); }
  .back { background:var(--back); transform:rotateY(180deg); }
  .emoji { font-size:3.5rem; line-height:1; }
  .word { font-size:2.8rem; font-weight:700; }
  .back .word { direction:rtl; font-size:3.4rem; }
  .hint { font-size:.8rem; opacity:.6; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; padding:10px 16px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  .big { width:min(90vw,420px); flex-wrap:nowrap; }
  .big button { flex:1; font-size:1.5rem; font-weight:700; padding:22px 10px; border-radius:16px; }
  .nav button { font-size:1.2rem; padding:16px 6px; }
  button.ok { background:#2a9d4a; }
  button.no { background:#d62828; }
  #score { font-size:1.2rem; font-weight:700; }
  button.alt { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  .sets button.on { background:var(--ink); color:#fff; }
  #onlyNo.on { background:#d62828; color:#fff; border-color:#d62828; }
  .small { font-size:.85rem; opacity:.75; }
</style>
</head>
<body>
  <h1>English ↔ עברית</h1>
  <div id="count"></div>
  <div class="row sets" id="sets">
    <button class="alt" data-set="all">All words</button>
    <button class="alt" data-set="A">List A · 55</button>
    <button class="alt" data-set="B">List B · 25</button>
    <button class="alt" data-set="C">List C · 28</button>
  </div>
  <div class="row">
    <button class="alt" id="onlyNo">Only words I don’t know</button>
  </div>

  <div class="scene" id="scene" title="Tap to flip">
    <div class="card" id="card">
      <div class="face front"><div class="emoji" id="fEmoji"></div><div class="word" id="fWord"></div><div class="hint">tap to flip</div></div>
      <div class="face back"><div class="emoji" id="bEmoji"></div><div class="word" id="bWord"></div></div>
    </div>
  </div>

  <div class="row big">
    <button class="ok" id="right">✓ Correct</button>
    <button class="no" id="wrong">✗ Not correct</button>
  </div>
  <div class="row big nav">
    <button class="alt" id="prev">← Back</button>
    <button id="speak">🔊 Listen</button>
    <button class="alt" id="next">Next →</button>
  </div>
  <div id="score"></div>
  <div class="row">
    <button class="alt" id="restart">↺ Start over</button>
    <button class="alt" id="shuffle">🔀 Shuffle</button>
    <button class="alt" id="dir">Start with: English</button>
    <button class="alt small" id="forget">Clear my ✓/✗ marks</button>
  </div>


<script>
const STARTER = [
  ["part of","חלק מ...",""],
  ["delicious","טעים",""],
  ["cousin","בן דוד / בת דודה",""],
  ["factory","מפעל",""],
  ["blog","בלוג",""],
  ["upset","מבואס / נסער",""],
  ["illegal","לא חוקי",""],
  ["taste","טעם",""],
  ["amazing","מדהים",""],
  ["concert","קונצרט",""],
  ["take it easy","תרגיע / קח את זה בקלות",""],
  ["adjust","להתאים",""],
  ["develop","לפתח",""],
  ["downtown","מרכז העיר",""],
  ["create","ליצור",""],
  ["unpleasant","לא נעים",""],
  ["cooking","בישול",""],
  ["last","להימשך / אחרון",""],
  ["festival","פסטיבל",""],
  ["chance","הזדמנות / סיכוי",""],
  ["exciting","מרגש",""],
  ["discount","הנחה",""],
  ["northern","צפוני",""],
  ["traditional","מסורתי",""],
  ["land","אדמה / ארץ",""],
  ["crowded","צפוף",""],
  ["for sale","למכירה",""],
  ["variety","מגוון",""],
  ["adventure","הרפתקה",""],
  ["business","עסק",""],
  ["country","מדינה",""],
  ["handbag","תיק יד",""],
  ["to admire","להתפעל / להעריך / להעריץ",""],
  ["cause","לגרום",""],
  ["click","ללחוץ / קליק",""],
  ["download","להוריד",""],
  ["gather","לאסוף / להתכנס",""],
  ["treat","לפנק / להתייחס",""],
  ["annual","שנתי",""],
  ["dressed","לבוש",""],
  ["kind","אדיב / סוג",""],
  ["loud","רועש / חזק",""],
  ["major","עיקרי / גדול",""],
  ["valuable","יקר ערך",""],
  ["entire","שלם / כולו",""],
  ["excited","נרגש",""],
  ["each other","זה את זה / אחד את השני",""],
  ["finally","סוף סוף",""],
  ["get together","להיפגש",""],
  ["look around","להסתכל מסביב",""],
  ["make sure","לוודא",""],
  ["possibly","אולי / ייתכן",""],
  ["quite","די / למדי",""],
  ["right now","עכשיו / כרגע",""],
  ["take care of","לטפל ב / לדאוג ל",""],
  ["capital","עיר בירה","","B"],
  ["carrot","גזר","","B"],
  ["engineer","מהנדס","","B"],
  ["expert","מומחה","","B"],
  ["insect","חרק","","B"],
  ["invention","המצאה","","B"],
  ["iron","ברזל / מגהץ","","B"],
  ["secret","סוד","","B"],
  ["sense","חוש / היגיון","","B"],
  ["source","מקור","","B"],
  ["technology","טכנולוגיה","","B"],
  ["assume","להניח","","B"],
  ["breathe","לנשום","","B"],
  ["design","לעצב / לתכנן","","B"],
  ["surprise","להפתיע","","B"],
  ["blind","עיוור","","B"],
  ["enormous","עצום / ענק","","B"],
  ["incorrect","לא נכון / שגוי","","B"],
  ["natural","טבעי","","B"],
  ["be unable to","לא מסוגל ל...","","B"],
  ["get back","לחזור / לקבל בחזרה","","B"],
  ["in fact","למעשה / בעצם","","B"],
  ["originally","במקור","","B"],
  ["so","אז / לכן / כל כך","","B"],
  ["such as","כמו / למשל","","B"],
  ["advertisement","פרסומת","","C"],
  ["bill","חשבון (לתשלום)","","C"],
  ["contract","חוזה","","C"],
  ["deal","עסקה","","C"],
  ["experience","ניסיון / חוויה","","C"],
  ["fee","תשלום / עמלה","","C"],
  ["literature","ספרות","","C"],
  ["tear","דמעה","","C"],
  ["website","אתר אינטרנט","","C"],
  ["agree","להסכים","","C"],
  ["charge","לגבות (כסף) / להטעין","","C"],
  ["convince","לשכנע","","C"],
  ["lie","לשקר / לשכב","","C"],
  ["offer","להציע","","C"],
  ["refuse","לסרב","","C"],
  ["shop","לעשות קניות","","C"],
  ["clear","ברור","","C"],
  ["digital","דיגיטלי","","C"],
  ["essential","חיוני","","C"],
  ["lucky","בר מזל","","C"],
  ["positive","חיובי","","C"],
  ["be wrong","לטעות","","C"],
  ["Congratulations!","מזל טוב! / ברכות!","","C"],
  ["credit (card)","(כרטיס) אשראי","","C"],
  ["despite","למרות","","C"],
  ["miss a chance","לפספס הזדמנות","","C"],
  ["plenty of","הרבה / שפע של","","C"],
  ["somehow","איכשהו","","C"]
].map(([en,he,emoji,set])=>({en,he,emoji,set:set||"A"}));

let cards = [], i = 0, heFirst = false;
let results = {};
let curSet = "all", onlyNo = false;
let status = {}; try { status = JSON.parse(localStorage.getItem("cardStatus") || "{}"); } catch(e) {}
try { const v = JSON.parse(localStorage.getItem("cardView") || "{}"); if (v.curSet) curSet = v.curSet; onlyNo = !!v.onlyNo; } catch(e) {}
function saveStatus(){ try { localStorage.setItem("cardStatus", JSON.stringify(status)); } catch(e) {} }
function pool(){ return STARTER.filter(c => curSet === "all" || c.set === curSet); }
function updateOnly(){
  const n = pool().filter(c => status[c.en] === false).length, o = document.getElementById("onlyNo");
  o.classList.toggle("on", onlyNo);
  o.textContent = onlyNo ? `Only ✗ words (${n}) · tap to show all` : `Only words I don’t know (${n})`;
}
function rebuild(){
  cards = onlyNo ? pool().filter(c => status[c.en] === false) : pool();
  i = 0; results = {};
  document.querySelectorAll("#sets button").forEach(b => b.classList.toggle("on", b.dataset.set === curSet));
  updateOnly();
  try { localStorage.setItem("cardView", JSON.stringify({curSet, onlyNo})); } catch(e) {}
}

const $ = id => document.getElementById(id);
const cardEl = $("card");

function render() {
  if (!cards.length) { $("fWord").textContent = onlyNo ? "No ✗ words 🎉" : "No cards"; $("bWord").textContent = ""; $("count").textContent = ""; return; }
  i = (i + cards.length) % cards.length;
  const c = cards[i];
  cardEl.style.transition = "none";
  cardEl.classList.remove("flipped");
  void cardEl.offsetWidth;
  cardEl.style.transition = "";
  $("fEmoji").textContent = $("bEmoji").textContent = c.emoji || "";
  const f = $("fWord"), b = $("bWord");
  f.textContent = heFirst ? c.he : c.en; f.style.direction = heFirst ? "rtl" : "ltr";
  b.textContent = heFirst ? c.en : c.he; b.style.direction = heFirst ? "ltr" : "rtl";
  $("count").textContent = `${i + 1} / ${cards.length}`;
}
function renderScore() {
  const vals = Object.values(results), good = vals.filter(Boolean).length;
  let t = `✅ ${good} correct · ❌ ${vals.length - good} not correct · out of ${cards.length}`;
  if (cards.length && vals.length >= cards.length) t = `🎉 Done! ${good} / ${cards.length} correct`;
  $("score").textContent = t;
}
function mark(ok) {
  if (!cards.length) return;
  results[cards[i].en] = ok; status[cards[i].en] = ok; saveStatus(); updateOnly();
  i++; render(); renderScore();
}
function speak() {
  const c = cards[i]; if (!c || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(c.en); u.lang = "en-US"; u.rate = .8;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

$("scene").onclick = () => cardEl.classList.toggle("flipped");
$("next").onclick = () => { i++; render(); };
$("prev").onclick = () => { i--; render(); };
$("speak").onclick = speak;
$("right").onclick = () => mark(true);
$("wrong").onclick = () => mark(false);
$("restart").onclick = () => { results = {}; i = 0; render(); renderScore(); };
$("shuffle").onclick = () => {
  for (let k = cards.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [cards[k], cards[j]] = [cards[j], cards[k]]; }
  i = 0; render();
};
$("dir").onclick = () => { heFirst = !heFirst; $("dir").textContent = "Start with: " + (heFirst ? "עברית" : "English"); render(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === " ") { e.preventDefault(); $("scene").click(); }
});

document.querySelectorAll("#sets button").forEach(b => b.onclick = () => { curSet = b.dataset.set; rebuild(); render(); renderScore(); });
$("onlyNo").onclick = () => { onlyNo = !onlyNo; rebuild(); render(); renderScore(); };
$("forget").onclick = () => { if (!confirm("Clear all ✓/✗ marks?")) return; status = {}; saveStatus(); rebuild(); render(); renderScore(); };
rebuild();
render(); renderScore();
</script>
</body>
</html>
