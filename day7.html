<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 7 – Word games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fff7e6; --paper:#ffffff; --ink:#2b2b3a; --soft:#6b6b7d;
    --sun:#ffd166; --sky:#8ecae6; --pink:#ef476f; --ok:#2a9d4a; --no:#d62828;
    --ok-bg:#dff3e4; --no-bg:#fbe0e0; --line:#2b2b3a;
    color-scheme: light;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1d1b26; --paper:#2a2836; --ink:#f3efe4; --soft:#b5b1c4;
      --sun:#c99a2e; --sky:#3f7f99; --pink:#ff6b8b; --ok:#4cc46d; --no:#ff6060;
      --ok-bg:#1f3a28; --no-bg:#432326; --line:#f3efe4; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#1d1b26; --paper:#2a2836; --ink:#f3efe4; --soft:#b5b1c4;
    --sun:#c99a2e; --sky:#3f7f99; --pink:#ff6b8b; --ok:#4cc46d; --no:#ff6060;
    --ok-bg:#1f3a28; --no-bg:#432326; --line:#f3efe4; color-scheme: dark;
  }
  :root.white {
    --bg:#ffffff; --paper:#ffffff; --ink:#2b2b3a; --soft:#6b6b7d;
    --sun:#ffd166; --sky:#8ecae6; --pink:#ef476f; --ok:#2a9d4a; --no:#d62828;
    --ok-bg:#dff3e4; --no-bg:#fbe0e0; --line:#2b2b3a; color-scheme: light;
  }
  .bgtoggle { margin-top:10px; font:inherit; font-size:.9rem; padding:6px 14px; border-radius:999px; border:2px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; font-size:17px; line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2 { font-family:"Fredoka","Rubik",system-ui,sans-serif; margin:0; line-height:1.15; }
  header { text-align:center; padding:12px 0 8px; }
  .day { display:inline-block; background:var(--pink); color:#fff; font-family:"Fredoka",sans-serif; font-weight:700;
         font-size:1.1rem; padding:6px 18px; border-radius:999px; transform:rotate(-3deg); }
  header h1 { font-size:2.2rem; margin-top:10px; }
  header p { color:var(--soft); margin:6px 0 0; }
  .he { direction:rtl; unicode-bidi:isolate; }

  section { margin-top:34px; }
  .step { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .num { flex:none; width:44px; height:44px; border-radius:50%; background:var(--sun); color:#2b2b3a; display:grid; place-items:center;
         font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.4rem; border:3px solid var(--line); }
  h2 { font-size:1.6rem; }
  .task { color:var(--soft); margin:4px 0 14px; }
  .task .he { display:block; }

  /* words */
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .tile { background:var(--paper); border:3px solid var(--line); border-radius:18px; padding:12px 12px 10px; }
  .tile .en { font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.35rem; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .say { border:0; background:transparent; font-size:1.2rem; cursor:pointer; padding:4px; border-radius:8px; color:inherit; }
  .reveal { margin-top:6px; width:100%; font:inherit; font-size:1rem; padding:8px; border-radius:10px; cursor:pointer;
            border:2px dashed var(--soft); background:transparent; color:var(--soft); }
  .reveal.shown { border:2px solid transparent; background:var(--sky); color:#1a1a26; font-weight:500; font-size:1.15rem; }
  .tile textarea { margin-top:8px; width:100%; font:inherit; font-size:.95rem; padding:8px; border-radius:10px;
                   border:2px solid var(--soft); background:var(--bg); color:var(--ink); resize:vertical; min-height:56px; }

  .chk { margin-top:6px; font:inherit; font-size:.9rem; padding:6px 12px; border-radius:10px; border:2px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  .sfb { font-size:.9rem; margin-top:4px; font-weight:500; }
  .sfb.good { color:var(--ok); } .sfb.bad { color:var(--no); }
  .verb { color:var(--soft); font-style:italic; }

  /* grammar */
  .rule { background:var(--sky); color:#1a1a26; border-radius:18px; padding:14px 16px; border:3px solid var(--line); }
  .rule table { width:100%; border-collapse:collapse; font-size:1.05rem; }
  .rule td { padding:4px 6px; }
  .rule td:first-child { font-weight:700; white-space:nowrap; }
  .rule b.s { color:#b0002d; font-size:1.2em; }
  .rule .he { margin-top:8px; font-size:.95rem; }
  ol.qs { list-style:none; padding:0; margin:16px 0 0; display:grid; gap:10px; }
  .q { background:var(--paper); border:3px solid var(--line); border-radius:16px; padding:12px 14px; }
  .q.right { background:var(--ok-bg); border-color:var(--ok); }
  .q.wrong { background:var(--no-bg); border-color:var(--no); }
  .q p { margin:0 0 8px; }
  .gap { display:inline-block; min-width:70px; border-bottom:3px solid var(--pink); text-align:center; font-weight:700; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { font:inherit; padding:9px 16px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  .opt.picked { background:var(--sun); color:#1a1a26; font-weight:700; }
  .q.right .opt.picked { background:var(--ok); color:#fff; border-color:var(--ok); }
  .q.wrong .opt.picked { background:var(--no); color:#fff; border-color:var(--no); }
  .fb { margin-top:8px; font-size:.95rem; font-weight:500; }
  .q.right .fb { color:var(--ok); } .q.wrong .fb { color:var(--no); }
  .q input[type=text], .q textarea { width:100%; font:inherit; padding:9px 10px; border-radius:10px; border:2px solid var(--line);
                   background:var(--bg); color:var(--ink); }
  .q textarea { min-height:70px; resize:vertical; }

  /* reading */
  .story { background:var(--paper); border:3px solid var(--line); border-radius:18px; padding:18px 20px; position:relative; }
  .story h3 { font-family:"Fredoka",sans-serif; font-size:1.4rem; margin:0 0 8px; }
  .story p { margin:0 0 10px; line-height:1.7; }
  .story p:last-child { margin-bottom:0; }
  .story mark { background:var(--sun); color:#1a1a26; padding:0 3px; border-radius:4px; }
  .model { margin-top:8px; padding:8px 10px; border-left:4px solid var(--ok); background:var(--ok-bg); border-radius:6px; font-size:.95rem; display:none; }
  .model.on { display:block; }

  .check { display:block; width:100%; margin-top:16px; font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.3rem;
           padding:16px; border:0; border-radius:16px; background:var(--pink); color:#fff; cursor:pointer; }
  .score { text-align:center; font-family:"Fredoka",sans-serif; font-size:1.3rem; margin-top:10px; min-height:1.5em; }

  footer { margin-top:40px; text-align:center; }
  #total { font-family:"Fredoka",sans-serif; font-size:1.5rem; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  .pills { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .pill { font:inherit; font-size:.95rem; padding:8px 14px; border-radius:999px; border:2px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  .pill.on { background:var(--ink); color:var(--bg); }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:22px; }
  .tab { font-family:"Fredoka",sans-serif; font-size:1.05rem; padding:12px 6px; border-radius:16px; border:3px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  .tab.on { background:var(--sun); color:#1a1a26; }
  .tab small { display:block; font-family:"Rubik",sans-serif; font-size:.75rem; opacity:.8; }
  #game { margin-top:18px; }
  .panel { background:var(--paper); border:3px solid var(--line); border-radius:18px; padding:16px; }
  .prog { display:flex; justify-content:space-between; color:var(--soft); font-size:.95rem; margin-bottom:10px; }
  .match { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .match .col { display:grid; gap:8px; }
  .mb { font:inherit; font-size:1.05rem; padding:12px 8px; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; min-height:52px; transition:transform .1s; }
  .mb.he { font-size:1.1rem; }
  .mb.sel { background:var(--sky); color:#1a1a26; }
  .mb.done { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); opacity:.55; cursor:default; }
  .mb.bad { background:var(--no-bg); border-color:var(--no); transform:translateX(3px); }
  .big { font-family:"Fredoka",sans-serif; font-size:1.8rem; text-align:center; margin:8px 0 14px; }
  .big.he { font-family:"Rubik",sans-serif; }
  .hint { text-align:center; color:var(--soft); margin-bottom:10px; letter-spacing:.05em; }
  .opts4 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opts4 .mb.right { background:var(--ok); color:#fff; border-color:var(--ok); opacity:1; }
  .opts4 .mb.wrong { background:var(--no); color:#fff; border-color:var(--no); }
  .row2 { display:flex; gap:10px; margin-top:12px; }
  .row2 input { flex:1; font:inherit; font-size:1.2rem; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); }
  .btn { font-family:"Fredoka",sans-serif; font-size:1.1rem; padding:10px 18px; border:0; border-radius:12px; background:var(--pink); color:#fff; cursor:pointer; }
  .btn.alt { background:var(--paper); color:var(--ink); border:2px solid var(--line); }
  .fb2 { min-height:1.6em; text-align:center; margin-top:10px; font-weight:500; }
  .fb2.ok { color:var(--ok); } .fb2.no { color:var(--no); }
  .center { text-align:center; margin-top:14px; }
  .sum h3 { font-family:"Fredoka",sans-serif; margin:0 0 6px; font-size:1.5rem; text-align:center; }
  .sum ul { list-style:none; padding:0; margin:10px 0 0; display:grid; gap:6px; }
  .sum li { display:flex; justify-content:space-between; gap:10px; padding:8px 12px; border-radius:10px; background:var(--no-bg); }
  .sent { font-size:1.25rem; text-align:center; margin:6px 0 16px; line-height:1.6; }
  @media (max-width:520px){ .tabs{ grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="day">Day 7</span>
    <h1>Word games</h1>
    <p>All the new words from List B and List C: four games, one after the other</p>
    <p class="he">משחקים עם המילים החדשות. כל טעות נשמרת כ-✗ גם בכרטיסיות, כדי לחזור עליה.</p>
    <button class="bgtoggle" id="bgToggle">⬜ White background</button>
  </header>

  <div class="pills" id="sets"></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-g="match">1 · 🧩 Match<small>התאמה</small></button>
    <button class="tab" data-g="quiz">2 · ✅ Quiz<small>בחירה</small></button>
    <button class="tab" data-g="spell">3 · ⌨️ Spell<small>כתיב</small></button>
    <button class="tab" data-g="sent">4 · 📝 Sentences<small>השלמה</small></button>
  </div>
  <div id="game"></div>
</div>

<script>
const bgBtn=document.getElementById("bgToggle");
function setWhite(on){ document.documentElement.classList.toggle("white",on); bgBtn.textContent=on?"🎨 Original colors":"⬜ White background"; try{ localStorage.setItem("bg-white",on?"1":"0"); }catch(e){} }
let startWhite=false; try{ startWhite=localStorage.getItem("bg-white")==="1"; }catch(e){}
setWhite(startWhite);
bgBtn.onclick=()=>setWhite(!document.documentElement.classList.contains("white"));


const WORDS=[
  {en:"capital",he:"עיר בירה",s:"Rome is the ___ of Italy.",a:"capital",list:"B"},
  {en:"carrot",he:"גזר",s:"Rabbits love to eat a ___.",a:"carrot",list:"B"},
  {en:"engineer",he:"מהנדס",s:"My aunt is an ___. She builds bridges.",a:"engineer",list:"B"},
  {en:"expert",he:"מומחה",s:"He knows everything about computers. He is an ___.",a:"expert",list:"B"},
  {en:"insect",he:"חרק",s:"A bee is an ___.",a:"insect",list:"B"},
  {en:"invention",he:"המצאה",s:"The phone is a great ___.",a:"invention",list:"B"},
  {en:"iron",he:"ברזל / מגהץ",s:"This old bridge is made of ___.",a:"iron",list:"B"},
  {en:"secret",he:"סוד",s:"Don’t tell anyone. It’s a ___!",a:"secret",list:"B"},
  {en:"sense",he:"חוש / היגיון",s:"Dogs have a great ___ of smell.",a:"sense",list:"B"},
  {en:"source",he:"מקור",s:"The sun is a ___ of energy.",a:"source",list:"B"},
  {en:"technology",he:"טכנולוגיה",s:"Phones and computers are modern ___.",a:"technology",list:"B"},
  {en:"assume",he:"להניח",s:"I ___ you are hungry after the long trip.",a:"assume",list:"B"},
  {en:"breathe",he:"לנשום",s:"Fish can ___ under water.",a:"breathe",list:"B"},
  {en:"design",he:"לעצב / לתכנן",s:"She wants to ___ clothes when she grows up.",a:"design",list:"B"},
  {en:"surprise",he:"להפתיע",s:"Let’s ___ Mom with a party!",a:"surprise",list:"B"},
  {en:"blind",he:"עיוור",s:"He can’t see. He is ___.",a:"blind",list:"B"},
  {en:"enormous",he:"עצום / ענק",s:"An elephant is ___.",a:"enormous",list:"B"},
  {en:"incorrect",he:"לא נכון / שגוי",s:"Your answer is ___. Try again.",a:"incorrect",list:"B"},
  {en:"natural",he:"טבעי",s:"This juice is 100% ___. No sugar!",a:"natural",list:"B"},
  {en:"be unable to",he:"לא מסוגל ל...",s:"I ___ come today. I’m sick.",a:"am unable to",list:"B"},
  {en:"get back",he:"לחזור / לקבל בחזרה",s:"We usually ___ home at six.",a:"get back",list:"B"},
  {en:"in fact",he:"למעשה / בעצם",s:"It isn’t cold. ___, it’s very hot!",a:"In fact",list:"B"},
  {en:"originally",he:"במקור",s:"My grandfather is ___ from Morocco.",a:"originally",list:"B"},
  {en:"so",he:"אז / לכן / כל כך",s:"It’s raining, ___ we stay at home.",a:"so",list:"B"},
  {en:"such as",he:"כמו / למשל",s:"I like fruit, ___ apples and bananas.",a:"such as",list:"B"},
  {en:"advertisement",he:"פרסומת",s:"I see an ___ for a new phone on TV.",a:"advertisement",list:"C"},
  {en:"bill",he:"חשבון (לתשלום)",s:"The phone ___ is 100 shekels this month.",a:"bill",list:"C"},
  {en:"contract",he:"חוזה",s:"Read the ___ before you sign it.",a:"contract",list:"C"},
  {en:"deal",he:"עסקה",s:"Two pizzas for the price of one? Great ___!",a:"deal",list:"C"},
  {en:"experience",he:"ניסיון / חוויה",s:"She has a lot of ___ with children.",a:"experience",list:"C"},
  {en:"fee",he:"תשלום / עמלה",s:"The bank charges a small ___.",a:"fee",list:"C"},
  {en:"literature",he:"ספרות",s:"Shakespeare is an important part of English ___.",a:"literature",list:"C"},
  {en:"tear",he:"דמעה",s:"A ___ runs down her face.",a:"tear",list:"C"},
  {en:"website",he:"אתר אינטרנט",s:"You can buy tickets on our ___.",a:"website",list:"C"},
  {en:"agree",he:"להסכים",s:"I ___ with you. You are right.",a:"agree",list:"C"},
  {en:"charge",he:"לגבות (כסף) / להטעין",s:"How much do you ___ for a haircut?",a:"charge",list:"C"},
  {en:"convince",he:"לשכנע",s:"I want a dog, but I can’t ___ my parents.",a:"convince",list:"C"},
  {en:"lie",he:"לשקר / לשכב",s:"Don’t ___! Tell me the truth.",a:"lie",list:"C"},
  {en:"offer",he:"להציע",s:"They ___ free coffee to every customer.",a:"offer",list:"C"},
  {en:"refuse",he:"לסרב",s:"I ___ to eat insects!",a:"refuse",list:"C"},
  {en:"shop",he:"לעשות קניות",s:"We ___ for clothes at the mall.",a:"shop",list:"C"},
  {en:"clear",he:"ברור",s:"The rules are very ___. Everybody understands them.",a:"clear",list:"C"},
  {en:"digital",he:"דיגיטלי",s:"I take photos with a ___ camera.",a:"digital",list:"C"},
  {en:"essential",he:"חיוני",s:"Water is ___ for plants.",a:"essential",list:"C"},
  {en:"lucky",he:"בר מזל",s:"You win every game. You’re so ___!",a:"lucky",list:"C"},
  {en:"positive",he:"חיובי",s:"I’m ___ that the answer is right.",a:"positive",list:"C"},
  {en:"be wrong",he:"לטעות",s:"You ___. The answer is 12, not 10.",a:"are wrong",list:"C"},
  {en:"Congratulations!",he:"מזל טוב! / ברכות!",s:"You passed the test? ___!",a:"Congratulations",list:"C"},
  {en:"credit (card)",he:"(כרטיס) אשראי",s:"Can I pay with a ___ card?",a:"credit",list:"C"},
  {en:"despite",he:"למרות",s:"We go out ___ the rain.",a:"despite",list:"C"},
  {en:"miss a chance",he:"לפספס הזדמנות",s:"It’s a great offer. Don’t ___!",a:"miss a chance",list:"C"},
  {en:"plenty of",he:"הרבה / שפע של",s:"Don’t worry, we have ___ time.",a:"plenty of",list:"C"},
  {en:"somehow",he:"איכשהו",s:"I don’t know how, but ___ he always wins.",a:"somehow",list:"C"}
];

let status={}; try{ status=JSON.parse(localStorage.getItem("cardStatus")||"{}"); }catch(e){}
function markWrong(w){ status[w.en]=false; try{ localStorage.setItem("cardStatus",JSON.stringify(status)); }catch(e){} drawSets(); }
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/[()!]/g,"")); u.lang="en-US"; u.rate=.85; speechSynthesis.speak(u); }catch(e){} }
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

let set="BC", game="match";
try{ const v=JSON.parse(localStorage.getItem("day7View")||"{}"); if(v.set) set=v.set; if(v.game) game=v.game; }catch(e){}
function save(){ try{ localStorage.setItem("day7View",JSON.stringify({set,game})); }catch(e){} }
function pool(){
  if(set==="B") return WORDS.filter(w=>w.list==="B");
  if(set==="C") return WORDS.filter(w=>w.list==="C");
  if(set==="X") return WORDS.filter(w=>status[w.en]===false);
  return WORDS.slice();
}
function drawSets(){
  const n=WORDS.filter(w=>status[w.en]===false).length;
  const defs=[["B","List B · 25"],["C","List C · 28"],["BC","Both · 53"],["X",`My ✗ words (${n})`]];
  const el=document.getElementById("sets"); el.innerHTML="";
  defs.forEach(([k,label])=>{ const b=document.createElement("button"); b.className="pill"+(k===set?" on":""); b.textContent=label;
    b.onclick=()=>{ set=k; save(); drawSets(); start(); }; el.appendChild(b); });
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ game=t.dataset.g; save(); start(); });

const G=document.getElementById("game");
function start(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.g===game));
  const p=pool();
  if(p.length<2){ G.innerHTML=`<div class="panel center">${set==="X"?"No ✗ words right now 🎉 Pick another list.":"Not enough words."}</div>`; return; }
  ({match:startMatch,quiz:()=>runRound(makeQuiz(p),"Quiz"),spell:()=>runRound(makeSpell(p),"Spell"),sent:()=>runRound(makeSent(p),"Sentences")})[game]();
}

/* ---------- summary ---------- */
function summary(title, ok, max, missed, again){
  const list=[...missed].map(en=>WORDS.find(w=>w.en===en));
  const ORDER=["match","quiz","spell","sent"], NAMES={match:"🧩 Match",quiz:"✅ Quiz",spell:"⌨️ Spell",sent:"📝 Sentences"};
  const nx=ORDER[ORDER.indexOf(game)+1];
  G.innerHTML=`<div class="panel sum"><h3>${title}: ${ok} / ${max} ${ok===max?"🎉":ok>=max*0.7?"👍":"💪"}</h3>
    ${list.length?`<p class="center">Words to practice again (saved as ✗ in the flashcards):</p><ul>${list.map(w=>`<li><b>${esc(w.en)}</b><span class="he">${w.he}</span></li>`).join("")}</ul>`:`<p class="center">No mistakes. Excellent!</p>`}
    <div class="center">${nx?`<button class="btn" id="nextg">Next: ${NAMES[nx]} →</button>`:`<p><b>All 4 games done! 🎉</b></p><button class="btn" id="nextg">Start again: ${NAMES.match}</button>`} <button class="btn alt" id="again">Play again</button></div></div>`;
  document.getElementById("again").onclick=again;
  document.getElementById("nextg").onclick=()=>{ game=nx||"match"; save(); start(); document.getElementById("tabs").scrollIntoView({behavior:"smooth"}); };
}

/* ---------- match ---------- */
function startMatch(){
  const pick=shuffle(pool()).slice(0,15), L=shuffle(pick), R=shuffle(pick);
  let selL=null, selR=null, done=0, mistakes=0; const missed=new Set();
  G.innerHTML=`<div class="panel"><div class="prog"><span>Tap a word and its meaning</span><span id="mstat">0 / ${pick.length}</span></div>
    <div class="match"><div class="col" id="cl"></div><div class="col" id="cr"></div></div></div>`;
  const cl=document.getElementById("cl"), cr=document.getElementById("cr");
  const mk=(w,side)=>{ const b=document.createElement("button"); b.className="mb"+(side==="R"?" he":""); b.textContent=side==="L"?w.en:w.he; b.dataset.en=w.en;
    b.onclick=()=>{ if(b.classList.contains("done")) return;
      if(side==="L"){ if(selL) selL.classList.remove("sel"); selL=b; speak(w.en); } else { if(selR) selR.classList.remove("sel"); selR=b; }
      b.classList.add("sel");
      if(selL&&selR){
        const a=selL, c=selR; selL=selR=null;
        if(a.dataset.en===c.dataset.en){ a.className=c.className="mb done"; c.classList.add("he"); done++;
          document.getElementById("mstat").textContent=`${done} / ${pick.length}`;
          if(done===pick.length) setTimeout(()=>summary("Match",pick.length-missed.size,pick.length,missed,startMatch),500);
        } else { mistakes++; const w2=WORDS.find(x=>x.en===a.dataset.en); missed.add(w2.en); markWrong(w2);
          a.classList.add("bad"); c.classList.add("bad");
          setTimeout(()=>{ a.classList.remove("bad","sel"); c.classList.remove("bad","sel"); },600); }
      } };
    return b; };
  L.forEach(w=>cl.appendChild(mk(w,"L"))); R.forEach(w=>cr.appendChild(mk(w,"R")));
}

/* ---------- one-question-at-a-time rounds ---------- */
function others(w, key, n){
  const p=pool().filter(x=>x.en!==w.en), src=p.length>=n?p:WORDS.filter(x=>x.en!==w.en);
  return [...new Set(shuffle(src).map(x=>x[key]))].filter(v=>v!==w[key]).slice(0,n);
}
function makeQuiz(p){ return shuffle(p).slice(0,10).map(w=>{ const heToEn=Math.random()<.5;
  const key=heToEn?"en":"he"; return {w, type:"choice", prompt: heToEn?`<div class="hint">What is this in English?</div><div class="big he">${w.he}</div>`:`<div class="hint">What does it mean in Hebrew?</div><div class="big">${esc(w.en)} <button class="say" aria-label="Listen">🔊</button></div>`,
    opts:shuffle([w[key],...others(w,key,3)]), ans:w[key], heOpts:!heToEn }; }); }
function makeSent(p){ return shuffle(p).slice(0,10).map(w=>({w, type:"choice",
  prompt:`<div class="hint">Choose the missing word</div><div class="sent">${esc(w.s).replace("___",'<span class="gap">____</span>')}</div>`,
  opts:shuffle([w.a,...others(w,"a",3)]), ans:w.a, heOpts:false })); }
function variants(w){
  const base=w.en.toLowerCase().replace(/[!]/g,"").trim(), v=new Set([base]);
  v.add(base.replace(/\(|\)/g,"").replace(/\s+/g," ").trim());
  v.add(base.replace(/\s*\(.*?\)/g,"").trim());
  v.add(base.replace(/^be /,""));
  return v;
}
function makeSpell(p){ return shuffle(p).slice(0,10).map(w=>{ const shown=w.en.replace(/\s*\(.*?\)/g,"").replace(/!/g,"");
  const pattern=shown.split("").map((ch,i)=>ch===" "?"&nbsp;&nbsp;":(i===0?ch:"_")).join(" ");
  return {w, type:"type", prompt:`<div class="hint">Write it in English</div><div class="big he">${w.he}</div><div class="hint">${pattern} <button class="say" aria-label="Listen">🔊</button></div>`}; }); }

function runRound(items, title){
  let i=0, ok=0; const missed=new Set();
  const show=()=>{
    if(i>=items.length){ summary(title,ok,items.length,missed,start); return; }
    const it=items[i];
    G.innerHTML=`<div class="panel"><div class="prog"><span>${i+1} / ${items.length}</span><span>✓ ${ok}</span></div>${it.prompt}
      ${it.type==="choice"?`<div class="opts4">${it.opts.map(o=>`<button class="mb${it.heOpts?" he":""}">${esc(o)}</button>`).join("")}</div>`:
       `<div class="row2"><input id="sp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn" id="spc">Check</button></div>`}
      <div class="fb2" id="fb2"></div><div class="center" id="nx"></div></div>`;
    const sb=G.querySelector(".say"); if(sb) sb.onclick=()=>speak(it.w.en);
    const fb=document.getElementById("fb2");
    const next=()=>{ const nx=document.getElementById("nx"); nx.innerHTML=`<button class="btn alt" id="nb">${i+1<items.length?"Next →":"See results"}</button>`;
      const nb=document.getElementById("nb"); nb.onclick=()=>{ i++; show(); }; nb.focus(); };
    if(it.type==="choice"){
      G.querySelectorAll(".opts4 .mb").forEach(b=>b.onclick=()=>{
        if(G.querySelector(".opts4 .right")) return;
        G.querySelectorAll(".opts4 .mb").forEach(x=>{ if(x.textContent===it.ans) x.classList.add("right"); });
        if(b.textContent===it.ans){ ok++; fb.className="fb2 ok"; fb.textContent="Correct!"; }
        else { b.classList.add("wrong"); missed.add(it.w.en); markWrong(it.w); fb.className="fb2 no"; fb.innerHTML=`${esc(it.w.en)} = <span class="he">${it.w.he}</span>`; }
        next(); });
    } else {
      const inp=document.getElementById("sp"), btn=document.getElementById("spc"); inp.focus();
      const check=()=>{ if(btn.disabled) return; const v=inp.value.toLowerCase().replace(/[’!.]/g,"").replace(/\s+/g," ").trim(); if(!v) return;
        btn.disabled=true; inp.disabled=true;
        if(variants(it.w).has(v)){ ok++; fb.className="fb2 ok"; fb.textContent="Correct!"; }
        else { missed.add(it.w.en); markWrong(it.w); fb.className="fb2 no"; fb.textContent=`The answer is: ${it.w.en}`; }
        speak(it.w.en); next(); };
      btn.onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
    }
  };
  show();
}

drawSets(); start();
</script>
